<div class="container">

    <div class="vehicle-banner">

        <h2>⚡ Calculateur de Charge</h2>

        <p>Temps de recharge véhicule électrique</p>

    </div>

    <div class="card">

        <label>🔋 Batterie (kWh)</label>

        <input
            id="capacite"
            type="number"
            min="10"
            max="120"
            value="46"
            oninput="update()">

        <br>

        <label>📉 Actuel</label>

        <div class="controls">

            <button
                type="button"
                onclick="changeValue('actuel',-1)">
                −
            </button>

            <span id="actuelValue">
                35%
            </span>

            <button
                type="button"
                onclick="changeValue('actuel',1)">
                +
            </button>

        </div>

        <input
            id="actuel"
            type="range"
            min="0"
            max="100"
            value="35"
            oninput="update()">

        <br>

        <label>🎯 Cible</label>

        <div class="controls">

            <button
                type="button"
                onclick="changeValue('cible',-1)">
                −
            </button>

            <span id="cibleValue">
                85%
            </span>

            <button
                type="button"
                onclick="changeValue('cible',1)">
                +
            </button>

        </div>

        <input
            id="cible"
            type="range"
            min="0"
            max="100"
            value="85"
            oninput="update()">

        <br>

        <label>⚡ Intensité</label>

        <div class="amp-grid">

            <button class="amp-btn"
                onclick="setAmp(8)">
                8A
            </button>

            <button class="amp-btn"
                onclick="setAmp(10)">
                10A
            </button>

            <button class="amp-btn"
                onclick="setAmp(12)">
                12A
            </button>

            <button class="amp-btn"
                onclick="setAmp(14)">
                14A
            </button>

            <button class="amp-btn"
                onclick="setAmp(16)">
                16A
            </button>

        </div>

        <div id="ampValue">

            10 A

        </div>

        <input
            id="amp"
            type="hidden"
            value="10">

    </div>

    <div class="result">

        <h2>

            ⏱ Temps estimé

        </h2>

        <div id="temps">

            3 h 20 min

        </div>

        <div id="etat">

            🟢

        </div>

    </div>

</div>
