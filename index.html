<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta
name="theme-color"
content="#007AFF">

<meta
name="apple-mobile-web-app-capable"
content="yes">

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta
name="apple-mobile-web-app-title"
content="Charge EV">

<meta
name="description"
content="Calculateur de temps de recharge véhicule électrique">

<title>⚡ Calculateur de Charge</title>

<link
rel="manifest"
href="manifest.json">

<link
rel="apple-touch-icon"
href="icons/icon-512.png">

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

    <!-- Bandeau -->

    <div class="vehicle-banner">

        <h2>⚡ Calculateur de Charge</h2>

        <p>
            Temps de recharge véhicule électrique
        </p>

    </div>

    <!-- Carte principale -->

    <div class="card">

        <label>

            🔋 kWh

        </label>

        <input
            id="capacite"
            type="number"
            min="10"
            max="120"
            value="45"
            oninput="update()">

        <br><br>

        <label>

            📉 Niveau actuel

        </label>

        <div class="controls">

            <button
                type="button"
                onclick="changeValue('actuel',-1)">
                −
            </button>

            <span id="actuelValue">
                14%
            </span>

            <button
                type="button"
                onclick="changeValue('actuel',1)">
                +
            </button>

        </div>

        <input
            id="actuel"
            type="range"
            min="0"
            max="100"
            value="14"
            oninput="update()">

        <br><br>

        <label>

            🎯 Niveau cible

        </label>

        <div class="controls">

            <button
                type="button"
                onclick="changeValue('cible',-1)">
                −
            </button>

            <span id="cibleValue">
                80%
            </span>

            <button
                type="button"
                onclick="changeValue('cible',1)">
                +
            </button>

        </div>

        <input
            id="cible"
            type="range"
            min="0"
            max="100"
            value="80"
            oninput="update()">

    </div>

    <!-- Intensité + Résultat -->

    <div class="card">

        <label>

            ⚡ Intensité

        </label>

        <div class="amp-grid">

            <button
                type="button"
                class="amp-btn"
                onclick="setAmp(8)">
                8A
            </button>

            <button
                type="button"
                class="amp-btn"
                onclick="setAmp(10)">
                10A
            </button>

            <button
                type="button"
                class="amp-btn"
                onclick="setAmp(12)">
                12A
            </button>

            <button
                type="button"
                class="amp-btn"
                onclick="setAmp(14)">
                14A
            </button>

            <button
                type="button"
                class="amp-btn"
                onclick="setAmp(16)">
                16A
            </button>

        </div>

        <input
            id="amp"
            type="hidden"
            value="8">

        <hr
            style="
            border:none;
            height:1px;
            background:rgba(255,255,255,.10);
            margin:12px 0;">

        <div class="result">

            <h2>

                ⏱ Temps estimé

            </h2>

            <div id="temps">

                5 h 23 min

            </div>

            <div id="etat">

                🟢 Charge lente

            </div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>

</html>
