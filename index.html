<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Calculateur de Charge</title>

    <meta
        name="theme-color"
        content="#007AFF">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- Bandeau principal -->

    <div class="vehicle-banner">

        <h2>⚡ Calculateur de Charge</h2>

        <p>
            Recharge intelligente véhicule électrique
        </p>

    </div>

    <!-- Batterie -->

    <div class="card">

        <label>🔋 Capacité Batterie</label>

        <input
            id="capacite"
            type="number"
            value="46">

    </div>

    <!-- Niveau actuel -->

    <div class="card">

        <label>📉 Niveau actuel</label>

        <div class="controls">

            <button onclick="changeValue('actuel',-1)">
                −
            </button>

            <span id="actuelValue">
                35%
            </span>

            <button onclick="changeValue('actuel',1)">
                +
            </button>

        </div>

        <input
            id="actuel"
            type="range"
            min="0"
            max="100"
            value="35"
            oninput="update()">

    </div>

    <!-- Niveau cible -->

    <div class="card">

        <label>🎯 Niveau cible</label>

        <div class="controls">

            <button onclick="changeValue('cible',-1)">
                −
            </button>

            <span id="cibleValue">
                85%
            </span>

            <button onclick="changeValue('cible',1)">
                +
            </button>

        </div>

        <input
            id="cible"
            type="range"
            min="0"
            max="100"
            value="85"
            oninput="update()">

    </div>

    <!-- Ampérage -->

    <div class="card">

        <label>⚡ Ampérage</label>
