<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#007AFF">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

    <meta
        name="apple-mobile-web-app-title"
        content="Charge EV">

    <title>⚡ Calculateur de Charge</title>

    <link
        rel="manifest"
        href="manifest.json">

    <link
        rel="apple-touch-icon"
        href="icons/icon-512.png">

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<div class="container">

    <!-- Bandeau principal -->

    <div class="vehicle-banner">

        <h2>⚡ Calculateur de Charge</h2>

        <p>
            Estimation rapide du temps de charge
        </p>

    </div>

    <!-- Batterie -->

    <div class="card">

        <label for="capacite">

            🔋 Capacité batterie (kWh)

        </label>

        <input
            id="capacite"
            type="number"
            min="10"
            max="120"
            value="46"
            oninput="update()">

    </div>

    <!-- Niveau actuel -->

    <div class="card">

        <label>

            📉 Niveau actuel

        </label>

        <div class="controls">

            <button
                type="button"
                onclick="changeValue('actuel',-1)">

                −

            </button>

            <span id="actuelValue">

                35%

            </span>

            <button
                type="button"
                onclick="changeValue('actuel',1)">

                +

            </button>

        </div>

        <input
            id="actuel"
            type="range"
            min="0"
            max="100"
            value="35"
            oninput="update()">

    </div>

    <!-- Niveau cible -->

    <div class="card">

        <label>

            🎯 Niveau cible

        </label>

        <div class="controls">

            <button
                type="button"
                onclick="changeValue('cible',-1)">

                −

            </button>

            <span id="cibleValue">

                85%

            </span>

            <button
                type="button"
                onclick="changeValue('cible',1)">

                +

            </button>

        </div>

        <input
            id="cible"
            type="range"
            min="0"
            max="100"
            value="85"
            oninput="update()">

    </div>

    <!-- Intensité -->

    <div class="card">

        <label>

            ⚡ Intensité de charge

        </label>

        <div class="amp-grid">

            <button
                type="button"
                class="amp-btn"
                onclick="setAmp(8)">

                8A

            </button>

            <button
                type="button"
                class="amp-btn"
                onclick="setAmp(10)">

                10A
