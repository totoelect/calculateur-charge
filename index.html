<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta
        name="theme-color"
        content="#007AFF">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

    <meta
        name="apple-mobile-web-app-title"
        content="Charge EV">

    <meta
        name="description"
        content="Calculateur de temps de recharge véhicule électrique">

    <title>⚡ Calculateur de Charge</title>

    <link
        rel="manifest"
        href="manifest.json">

    <link
        rel="apple-touch-icon"
        href="icons/icon-512.png">

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<div class="container">

    <!-- Bandeau -->

    <div class="vehicle-banner">

        <h2>⚡ Calculateur de Charge</h2>

        <p>
            Temps de recharge véhicule électrique
        </p>

    </div>

    <!-- Résultat -->

    <div class="result">

        <h2>
            ⏱ Temps estimé
        </h2>

        <div id="temps">
            0 h 00 min
        </div>

        <div id="energie">
            Énergie chargée : 0,0 kWh
        </div>

        <div id="etat">
            ⚡ Charge rapide AC
        </div>

    </div>

    <!-- Batterie -->

    <div class="card">

        <div class="battery-box">

            <label>
                🔋 Capacité batterie
            </label>

            <input
                id="capacite"
                type="number"
                value="45"
                oninput="update()">

        </div>

        <br>

        <label>
            📉 Niveau actuel
        </label>

        <div class="controls">

            <button
                type="button"
                onclick="changeValue('actuel',-1)">
                −
            </button>

            <span id="actuelValue">
                14%
            </span>

            <button
                type="button"
                onclick="changeValue('actuel',1)">
                +
            </button>

        </div>

        <input
            id="actuel"
            type="range"
            min="0"
            max="100"
            value="14"
            oninput="update()">

        <br><br>

        <label>
            🎯 Niveau cible
        </label>

        <div class="controls">

            <button
                type="button"
                onclick="changeValue('cible',-1)">
                −
            </button>

            <span id="cibleValue">
                80%
            </span>

            <button
                type="button"
                onclick="changeValue('cible',1)">
                +
            </button>

        </div>

        <input
            id="cible"
            type="range"
            min="0"
            max="100"
            value="80"
            oninput="update()">

    </div>

    <!-- Installation + Intensité -->

    <div class="card">

        <label>
            🔌 Installation
        </label>

        <div class="phase-grid">

            <button
                type="button"
                class="phase-btn"
                onclick="setPhase('mono')">

                1Φ

            </button>

            <button
                type="button"
                class="phase-btn"
                onclick="setPhase('tri')">

                3Φ

            </button>

        </div>

        <input
            id="phase"
            type="hidden"
            value="tri">

        <label>
            ⚡ Intensité
        </label>

        <div class="amp-grid">

            <button
                type="button"
                class="amp-btn"
                onclick="setAmp(8)">
                8A
            </button>

            <button
                type="button"
                class="amp-btn"
                onclick="setAmp(10)">
                10A
            </button>

            <button
                type="button"
                class="amp-btn"
                onclick="setAmp(12)">
                12A
            </button>

            <button
                type="button"
                class="amp-btn"
                onclick="setAmp(14)">
                14A
            </button>

            <button
                type="button"
                class="amp-btn"
                onclick="setAmp(16)">
                16A
            </button>

            <button
                type="button"
                class="amp-btn"
                onclick="setAmp(20)">
                20A
            </button>

            <button
                type="button"
                class="amp-btn"
                onclick="setAmp(25)">
                25A
            </button>

            <button
                type="button"
                class="amp-btn"
                onclick="setAmp(32)">
                32A
            </button>

        </div>

        <input
            id="amp"
            type="hidden"
            value="8">

    </div>

</div>

<script src="app.js"></script>

</body>

</html>
